<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <form action="/forumSend" method="post">
        Comment: <input type="text" name="comment" id="comment" required="true">
        <br><br>
        <input type="submit" value="Send">
        <br><br>
    </form>

    <h2>Posts</h2>
    {% for post in posts %}
        <br>
        <div class="post">
            User: <strong>{{ post.username }}</strong> ({{ post.userid }})
            <br><span class="time"><i>{{ post.created_at }}</i></span>
            <br>{{ post.comment }}
        </div>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}
    
</body>
</html>
