<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gästbok</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <form action="/send" method="post">
        Name: <input type="text" name="name" id="name">
        <br><br>
        E-mail: <input type="text" name="mail" id="mail">
        <br><br>
        Homepage: <input type="text" name="homepage" id="homepage">
        <br><br>
        Phone Number: <input type="text" name="phone" id="phone">
        <br><br>
        Comment: <input type="text" name="comment" id="comment">
        <br><br>
        <input type="submit" value="Send">
        <br><br>
    </form>

    Posts:
    <br>

    <table class="posts">
        {% for post in posts %}
            <tr>
                <th>{{ post.name }}</th>
                <td></td>
            </tr>
        {% endfor %}
    </table>
    
</body>
</html>
