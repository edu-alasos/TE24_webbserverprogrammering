<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gästbok</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <form action="/send" method="post">
        Name: <input type="text" name="name" id="name" required="true">
        <br><br>
        E-mail: <input type="text" name="mail" id="mail" required="true">
        <br><br>
        Homepage: <input type="text" name="homepage" id="homepage" required="true">
        <br><br>
        Phone Number: <input type="text" name="phone" id="phone" required="true">
        <br><br>
        Comment: <input type="text" name="comment" id="comment" required="true">
        <br><br>
        <input type="submit" value="Send">
        <br><br>
    </form>

    <h2>Posts</h2>
    {% for post in posts %}
        <div class="post">
            <strong>{{ post.name }}</strong> ({{ post.mail }})
            <span class="time"><i>{{ post.time }}</i></span>
            <p>{{ post.comment }}</p>
            {% if post.homepage %}<a href="{{ post.homepage }}">{{ post.homepage }}</a>{% endif %}
        </div>
    {% else %}
        <p>No posts yet.</p>
    {% endfor %}
    
</body>
</html>
